name: Notebook static validation

on:
  push:
    branches: [main]
    paths:
      - "notebooks/**"
      - "scripts/validate_notebooks.py"
      - ".github/workflows/notebook-validation.yml"
  pull_request:
    paths:
      - "notebooks/**"
      - "scripts/validate_notebooks.py"
      - ".github/workflows/notebook-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-notebooks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install schema validator only
        run: python -m pip install "nbformat>=5.10,<6"
      - name: Validate notebook structure and source syntax
        run: python scripts/validate_notebooks.py
